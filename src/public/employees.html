<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees | Dangote Canteen Management Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="legacy-brand-lockup">
        <img class="legacy-brand-mark" src="/img/dangote-logo.svg" alt="Dangote">
        <div class="legacy-brand-copy">
          <span class="legacy-brand-wordmark">Dangote</span>
          <span class="legacy-brand-subtitle">Canteen Management Platform</span>
          <span class="legacy-brand-credit">Developed by Emocom Technologies</span>
        </div>
      </div>
    </div>
    <div class="sidebar-nav">
      <a href="/dashboard.html" class="nav-link">📊 Dashboard</a>
      <a href="/employees.html" class="nav-link active">👥 Employees</a>
      <a href="/meals.html" class="nav-link">🍽️ Meal Plans</a>
      <a href="/tickets.html" class="nav-link">🎫 Tickets</a>
      <a href="/reports.html" class="nav-link">📈 Reports</a>
    </div>
  </nav>
  <div class="main-content">
    <div class="header">
      <h2>Employees</h2>
      <div>
        Welcome, <strong id="current-user"></strong>
        <button id="logout-btn" class="btn btn-danger btn-sm" style="margin-left: 15px;">Logout</button>
      </div>
    </div>
    <div class="page-content">
      <div class="toolbar">
        <input type="text" id="search-input" class="form-control" placeholder="Search employees...">
        <button class="btn btn-secondary" onclick="openAddModal()">+ Add Employee</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Employee #</th>
              <th>Department</th>
              <th>Email</th>
              <th>Badge #</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employees-table">
            <tr><td colspan="7" style="text-align:center; padding: 20px; color: #666;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="legacy-footer">Dangote Canteen Management Platform | Developed by Emocom Technologies</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="employee-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Add Employee</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="employee-form">
        <input type="hidden" id="employee-id">
        <div class="form-group">
          <label>Employee Number *</label>
          <input type="text" id="emp-number" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="emp-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Department *</label>
          <input type="text" id="emp-department" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="emp-email" class="form-control">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="emp-phone" class="form-control">
        </div>
        <div class="form-group">
          <label>Badge Number *</label>
          <input type="text" id="emp-badge" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Meal Plan</label>
          <select id="emp-meal-plan" class="form-control">
            <option value="">-- No Meal Plan --</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
          <button type="button" class="btn btn-primary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-secondary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/employees.js"></script>
</body>
</html>
